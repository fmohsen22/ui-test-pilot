# ---------------------------------------------------------------- http
quarkus.http.port=8088

# ---------------------------------------------------------------- database
# Defaults match server/docker-compose.yml. Override via env for another server.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${UITP_DB_USER:uitp}
quarkus.datasource.password=${UITP_DB_PASSWORD:uitp}
quarkus.datasource.jdbc.url=${UITP_DB_URL:jdbc:postgresql://localhost:5544/uitp}
quarkus.hibernate-orm.schema-management.strategy=update

# ---------------------------------------------------------------- uitp runner
# Absolute path to the built ui-test-pilot checkout (contains dist/cli.js).
# Default assumes the server runs from ui-test-pilot/server/.
uitp.pilot-dir=${UITP_PILOT_DIR:..}
# The app-under-test's uitests directory (contains uitp.config.json + scenarios/).
uitp.project-dir=${UITP_PROJECT_DIR:${uitp.pilot-dir}/examples}
# Node.js binary (>= 22). On Windows point to node.exe if not on PATH.
uitp.node-bin=${UITP_NODE_BIN:node}
# Command timeout for a single uitp invocation (seconds).
uitp.cli-timeout-seconds=${UITP_CLI_TIMEOUT:180}

# ---------------------------------------------------------------- LLM (OpenAI-compatible)
# Works with api.openai.com, an internal OpenAI-compatible gateway, or any
# service exposing POST {base-url}/chat/completions with function calling.
llm.base-url=${UITP_LLM_BASE_URL:https://api.openai.com/v1}
llm.api-key=${UITP_LLM_API_KEY:}
llm.model=${UITP_LLM_MODEL:gpt-4o}
llm.max-tool-iterations=${UITP_LLM_MAX_ITERATIONS:16}
llm.heal-attempts=${UITP_LLM_HEAL_ATTEMPTS:3}

# ---------------------------------------------------------------- auth
# Comma-separated emails that get the admin role on registration.
# Independent fallback: the very first registered user becomes admin.
uitp.admin-emails=${UITP_ADMIN_EMAILS:}
# Session lifetime in hours.
uitp.session-hours=${UITP_SESSION_HOURS:72}
